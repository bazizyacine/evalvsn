# =========================================================================
#  THE LIMIT STUDY - one bed, four axes, three values each, the base
#  excluded and the difficulty rising at every step (the author's design
#  of 28/08/2026).
#
#  The bed is S1 at half the mesh destroyed, the only fair one for this
#  question: S1 is the sole scenario in which nothing but relays burn,
#  the camera and the sink outliving the front, so what is measured is
#  the network and not the death of an organ.
#
#  The base point is the S1/50 % set already measured over ten
#  realisations - 100 nodes, 40 m spacing, one image every 30 s,
#  detection at 60 s, standby 60:32 - and it is not repeated on any
#  axis. A value survives if AOMDV_QPV's mean holds above 28 dB, the
#  article's acceptability floor; the standard deviation is reported
#  beside it, because a mean can clear the floor while individual
#  simulations fall under it.
#
#  A - SCALE, the path lengthens. 196, 225, 256 nodes at 40 m: fields of
#      520, 560 and 600 m, 26, 28 and 30 hops corner to corner. It stops
#      at 256 because AOMDV's NETWORK_DIAMETER is 30 hops and AOMDV_QPV
#      inherits it; at 324 both stacks receive nothing at all, which is
#      the protocol's ceiling and not the mechanism's. Node counts are
#      perfect squares because the simulator lays out int(sqrt(nn))
#      columns and puts the remainder in a ragged extra block: at 200
#      nodes the sink lands 12 hops from the camera instead of at the
#      opposite corner, and the scenario is no longer the same one.
#  B - CAPTURE CADENCE, the load rises. One image every 25, 20, 15 s
#      against the base's 30. All four periods sit above AOMDV's
#      ACTIVE_ROUTE_TIMEOUT of 10 s, so every image opens a fresh route:
#      the axis measures the cost of re-opening rather than the benefit
#      of a route held warm from one image to the next.
#  C - DENSITY, the contention rises at CONSTANT FIELD. 144 nodes at
#      33 m, 196 at 28, 225 at 26, all spanning about 363 m, so the
#      camera-to-sink distance holds and only the number of nodes
#      sharing the channel changes. Sparser is not an option: the canopy
#      budget already refuses the link at 60 m.
#  D - SCALAR STANDBY, the route goes cold. 5:32, 10:32, 20:32 against
#      the base's 60:32. The values straddle AOMDV's ACTIVE_ROUTE_TIMEOUT
#      of 10 s, which is what makes them differ at all: at 5 s the entry
#      is refreshed before it expires and the route stays warm, at 10 s
#      it sits exactly on the timeout, at 20 s it is cold when the next
#      packet arrives. Periods above the timeout - the base's 60 s, and
#      anything sparser - are all equally cold, which is why cutting the
#      standby and tripling it both measured nothing at S5. Neighbour
#      tables are unaffected either way: HELLO runs every second,
#      independent of this flow.
#
#  Fronts are recalibrated per configuration so every point still loses
#  about half its nodes: 49 to 55 % throughout.
#
#  SUPPORTING METRICS. A quality figure that moves without saying why is
#  not an interpretation, so every axis is read with the quantities that
#  explain its own mechanism. All are in the harvested catalogue.
#    every axis  usable images and their share of the decoded ones, plus
#                energy per usable image - the operator's cost of one
#                actionable picture, which is what an energy figure means
#                here and what a raw joule count does not.
#    A, scale    delay and packet delivery ratio: a longer path costs
#                time before it costs quality, and energy rises with the
#                number of forwards per delivered packet.
#    B, cadence  loss ratio and jitter: a faster shutter competes with
#                itself, and the queue is where that shows first.
#    C, density  loss ratio and delay again, but read against the node
#                count: contention, not path length, is what varies.
#    D, standby  alert latency above all - it is the cost of re-opening a
#                route, and it is the quantity the 10 s timeout acts on.
#
#  Two of these are new: setGraphs.pl now counts the usable images and
#  their share of the decoded ones. They can only be produced by runs
#  made from now on, because pruning removes the packet trace the
#  harvest reads and no already-pruned set can be re-analysed. The base
#  point is therefore re-run with the axes, which also proves the new
#  counters changed nothing else: it must reproduce 38.9 dB exactly.
# --- A, scale
