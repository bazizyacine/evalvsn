# Declaration of the sets of the article: study 09 (experiment E0) and
# study 10 (experiments E1 to E5 and the agents' traces), each in the order
# of its sets.txt. Every set the two sets.txt list is declared here, and no
# other.
#
# A set is run by run_sets.sh, never implicitly, with the seeds of its fire
# (studies/09-comparative/README.md):
#   bash run_sets.sh --list
#   bash run_sets.sh --seed-name=set_AOMDV_QPV_GC-PN-0p03-13_p9-n100-d40-fire \
#     set_AOMDV_QPV_GC-PN-0p03-13_p9-n100-d40-fire-hybrid
# run_sets.sh refuses to overwrite an existing set without --force.
#
# The encoder files live in ipFiles/<label>.dat: GC-PN-<coefficient>-13, the
# GOP coefficient and 13 priority levels (0p01597, 0p02525 and 0p03 give GOPs
# 3-9, 6-6 and 9-3 of the fire video; 0p01597 and 0p15671 give GOP 9-3 of the
# forest and smoke videos), and GC-QC-0p1, the GOP coefficient 0.03 with the
# quality coefficient 0.1. The README.md of studies 09 and 10 give the grammar
# of the names of their sets.
#
# COLUMNS, in this order (a missing trailing column takes its default)
#
# name     the set, as its sets.txt lists it
# protocol AOMDV (the release's stack) or AOMDV_QPV (the cross-layer stacks)
# label    the encoder file, ipFiles/<label>.dat
# payload  the largest packet payload in bytes, header included
# nodes    the number of nodes of the square grid
# dist     the grid spacing in metres
# capture  period:ipt[:detect], in seconds: frame k is captured at
#          detect + (k-1)*period, and its packets leave one every ipt
# video    the content, evalvsn/videos/<video>.avi
# prop     tworay, or shadowing[:exp:std], the log-normal shadowing of ns-2;
#          its draws follow the seed of the realisation
# standby  period:size: one reading of size bytes every period seconds from
#          the camera to the sink, for the whole simulation; 0, none
# fire     t0:v[:x:y]: the ignition at (x, y) metres at t0 seconds, and the
#          speed of the front in metres per second, that of its head when the
#          knob firewind makes it an ellipse; each node is switched off when
#          the front reaches it
# metrics  what setGraphs.pl computes: all, the whole catalogue
# sims     the number of realisations; the encoding, which depends only on
#          the video and the encoder file, is shared by them
# knobs    k=v[,k=v], the switches forwarded to evalvsn.tcl, whose header
#          gives each with its default (ns-2-modules/README.md, those of the
#          revision); simtime=S, read by run/set.sh and never passed to ns-2,
#          makes the simulation last at least S whole seconds

