# Declaration of the EvalVSN experiment sets.
#
# A set is run by run_sets.sh, never implicitly:
#   bash run_sets.sh --list
#   bash run_sets.sh set_AOMDV_QPV_GC-PN-0p03-13_p30-n100-d200
#
# The encoder files live in ipFiles/<label>.dat, one per codec, shared by the
# sets of both stacks. The grammar of the labels and of the simulation
# identifiers they carry (GC-PN-0p03-13 = GOP coefficient 0.03, 13 priority
# levels; GC-DCT-LLM8 = transform and zone; JPEG-Q20-72 = the witness) is
# written in studies/README.md, as is the grammar of the set names.
#
# COLUMNS
#
# metrics  What setGraphs.pl computes and plots, comma-separated. The catalogue
#          is complete and stays complete: nothing is ever dropped from it, only
#          deselected per set. Groups avoid listing forty-seven entries by hand.
#
#            core     packets sent, delivery ratio, loss by frame type, PSNR,
#                     reference PSNR
#            prio     loss per priority level, M1-M13 and D1-D13
#            quality  SSIM, reference SSIM, mean compression ratio
#            energy   energy consumption, power consumption, life time
#            network  delay, jitter, throughput
#            application  the survival study's operator metrics (R16):
#                     alert latency, alert delivery, service duration -
#                     usability judged by the decoder's own per-frame
#                     verdict at the study's 28 dB acceptability floor
#            all      the whole catalogue (default)
#
#          A single metric name also works: pdr, psnr, delay. Adding a metric to
#          setGraphs.pl makes it selectable here without touching this format.
#
#          Use `all` unless a run is deliberately narrowed: the thesis draws on
#          metrics this article does not report, and a set computed without them
#          has to be run again to get them back.
#
# sims     Number of independent realisations. The encoding is shared across
#          them - it depends only on the video and the encoder parameters, not
#          on the seed - so N realisations cost one encoding, N simulations and
#          N decodings. Seeds are derived from the set name and the run index,
#          so a campaign repeats identically.
#
# NAMING
#
# The grammar of the set names is written in studies/README.md. A variant
# never takes the name of the set it varies.
#
# This file is copied verbatim into the companion repository the article points
# readers at, so it carries no path that only exists in the working repository:
# a reference a reader cannot follow is worse than no reference.
#
# The point is that a variant never takes the name of the campaign the article
# reports. run_sets.sh already refuses to overwrite an existing set without
# --force, so the two rules together mean a new run cannot quietly replace the
# measurements a published figure rests on. The audit checks the shape of every
# name declared here.
#
# The radio is IEEE 802.15.4 for every set, the only radio of the thesis
# (the author's rule of 14 September 2026): there is no radio column.
#
# capture  period:ipt[:detect], in seconds - the source's capture calendar
#          (R25/R40): frame k is captured at detect + (k-1)*period, and its
#          packets drain one every ipt, as a real sensor's transmit queue
#          does. 0:0, the default, keeps the encoder's own video schedule
#          and its same-instant bursts.
#
# dist     Grid spacing in metres (default 100, the historical lab grid).
#          25 nodes at 200 m cover the same area as 100 at 100 m with the
#          same hop count and a realistic 802.15.4 contention field.
#          All trailing columns are optional, so existing declarations read
#          unchanged.
#
# fire     t0:v[:x:y] - the forest-fire front (the survival study's event).
#          Ignition at (x, y) metres (default 0:0, the camera's corner) at
#          t0 seconds, radial spread at v metres per second; each node is
#          destroyed - its radio switched off - the instant the front
#          reaches it. The death schedule is a pure function of the grid
#          and these numbers: deterministic and replayable. 0, the default,
#          runs the static scenario unchanged.
#
# prop     Propagation model: tworay (the default when absent - the
#          historical model, every existing declaration replays unchanged)
#          or shadowing[:exp:std] - ns-2's log-normal shadowing for the
#          forest canopy (the author's R19 answer, survival campaign),
#          anchored defaults exp 3.2 / std 7 dB from pine-forest 2.4 GHz
#          measurements, the optional override riding the same token. The
#          shadowing RNG follows the realisation seed: the seed law of the
#          protocol applies to the channel draws too.
#
# standby  period:size - the bi-regime standby flow (the author's R15
#          answer): scalar readings of size bytes every period seconds
#          from the camera node to the sink, for the whole mission; the
#          video burst joins them at the capture calendar's detect
#          instant. 0, the default, none.
#
# knobs    k=v[,k=v] - the stack knobs the comparative study sweeps,
#          forwarded to evalvsn.tcl as its own options; the header of
#          evalvsn.tcl lists every switch and its default. 0, the default, leaves radio-params.tcl's values. Trailing, after
#          sims, so that every earlier declaration reads unchanged.
#
# The column order tells the story of a set (the author's order,
# 24/08/2026): the terrain, the source it carries, the scenario played
# on it - propagation, standby regime, fire - and last what is
# harvested: metrics second to last, sims closing the line.
#
# =========================================================================
#  CONTENTS - the blocks follow the order in which the article tells the
#  study (Section 4). No set is declared here without carrying a figure
#  of the text or justifying one of its choices.
#
#  STAGE 1 - static viability (TwoRay, p30-n100-d200)
#    three-codec base point ......... the base-point table
#    load axis ...................... p20, p15, p12, p10, p5
#    scale axis ..................... n144, n196, n225, n400, n500
#    range axis ..................... d250, d300, d325, d350
#
#  STAGE 2 - survival (canopy shadowing 3.2:0, standby 60:32, d40)
#
#  The comparison grid: five scenarios at three front speeds each,
#  calibrated so every one of them loses a quarter, a half and three
#  quarters of its nodes. That is what lets the campaign separate WHICH
#  organ burns from HOW MUCH burns.
#    grid-spacing choice ............ the -shad probes, no fire
#    S1, the mesh burns ............. m25, m50, m75 (3 codecs x 2 stacks)
#    S2, the path cut, source side .. x25, x0p5, x75
#    S3, the path cut, sink side .... xs25, xs0p5, xs75
#    S4, the sink besieged .......... s0p5, s50, s75
#    S5, the camera reached ......... f0p5, f50, f75
#    S5's pre-grid speed sweep ...... f0p25, f1, f2 (cited in the prose
#                                     as what it is, a wider sweep run
#                                     before the grid was established)
#
#  REFINEMENT AXES on S5's 25 % point - capture cadence, detection
#  instant, density, standby: a1p15, a1p60, a2d20, a2d120, a2w, a2w2,
#  d30-a3, d60-a3, d80-a3, a4nosb
#
#  NETWORK AXES on S1, S2 and S3, where the endpoints outlive the front
#  and the network alone is on trial. Density is varied at CONSTANT
#  field (the node count carries it, the speed recalibrated per grid so
#  the fraction destroyed holds): d45/d33 against the d40 base, plus the
#  standby cut, at m50, m75, x50 and xs50.
# =========================================================================

# --- identity ---------------------- | stack --- | terrain ---- | source --- | scenario ------------ | harvest ---
# name                   protocol     label     payload  nodes  dist  capture   video        prop    standby  fire  metrics  sims


# The IJCNA article's study of record (29/08/2026, the author's plan
# reset after the article's reorientation): the fire-survival study.
# The application finally happens to the network - an ignition point,
# a fire front advancing at a stated speed, nodes destroyed as it
# passes - while the chain carries the fire_qcif sequence (FLAME 2,
# IEEE Dataport 10.21227/swyw-6j78) from the camera node to the sink.
# The static-viability measures (base, load/scale/range frontiers) are
# re-run under this plan as its first stage; the survival campaign -
# collapse frontiers over fire-front speed and node-loss fraction - is
# its second and headline stage. Rules in force: ten realisations at
# the base and at every sensitive frontier point, deterministic
# single-realisation probes (ns-2's own sequence), everything through
# run_sets.sh and declared recipes, official GC-PN naming.
#
# Declarations follow as the stages open.

# STAGE 1 - static viability under the fire-study plan (the author's plan of
# 23/08/2026): three representative codecs - light 0.001-1,
# median 0.011-7, heavy 0.03-13 - on the EEA-validated terrain (100 nodes,
# 200 m, one image every 30 s, packets drained every 50 ms), fire_qcif as the
# video, TwoRayGround (shadowing is reserved for the survival campaign, R19),
# ten realisations per set. The classical stack runs as the internal reference.
