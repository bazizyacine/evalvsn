# Declaration of the EvalVSN experiment sets.
#
# Replaces the ten twenty-eight-line blocks of sets.sh, in which only the
# protocol/label pair varied. The values below are taken verbatim from sets.sh,
# from the live blocks as well as the commented-out ones.
#
# A set is run by run_sets.sh, never implicitly:
#   bash run_sets.sh --list
#   bash run_sets.sh set_test
#   bash run_sets.sh set2_GC-PN set3_GC-QC
#
# The expected parameter files are ../ipFiles/encoder_<name>.dat and
# ../ipFiles/decoder_<name>.dat.
#
# name                   protocol     label       payload  nodes   video
set_test                 AOMDV_QPV    GC-PN       100      100     mobile_qcif
set_AOMDV_GC-PN          AOMDV        GC-PN       100      100     mobile_qcif
set_AOMDV_QPV_GC-PN      AOMDV_QPV    GC-PN       100      100     mobile_qcif
set2_GC-PN               AOMDV_QPV    GC-PN       100      100     mobile_qcif
set3_GC-QC               AOMDV_QPV    GC-QC       100      100     mobile_qcif
set4_GC-DCT              AOMDV_QPV    GC-DCT      100      100     mobile_qcif
set5_GC-ZS               AOMDV_QPV    GC-ZS       100      100     mobile_qcif
set6_GC-FPS-QC           AOMDV_QPV    GC-FPS-QC   100      100     mobile_qcif
set7_GC-FPS              AOMDV_QPV    GC-FPS      100      100     mobile_qcif
set8_GC-RES              AOMDV_QPV    GC-RES      100      100     mobile_qcif
